# Relais du Calendrier PA : synchronise tout l'agenda (Sénat, dossiers suivis, Assemblée nationale, agendas Google ou
# Outlook), publie les agendas diffusés et, chaque matin, le répertoire des dossiers en cours (relais/LISEZMOI.md).
name: Relais Calendrier PA
on:
  schedule:
    # Toutes les deux heures, de 6 h à 22 h (heure de Paris, en heure d'hiver)
    - cron: '17 5-21/2 * * *'
  workflow_dispatch:
    inputs:
      repertoire:
        description: Refaire aussi le répertoire des dossiers en cours (sinon, premier passage du matin seulement)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: relais
  cancel-in-progress: false
jobs:
  relais:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action épinglée sur son empreinte de commit (v7.0.1)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Relais
        run: node --version && node relais/relais.mjs
        env:
          GRIST_URL: ${{ vars.GRIST_URL }}
          GRIST_DOC: ${{ secrets.GRIST_DOC }}
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          # Jeton GitHub limité aux gists (publication des abonnements de consultation)
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FORCER_REPERTOIRE: ${{ inputs.repertoire }}
